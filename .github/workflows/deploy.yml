name: Build and deploy to Azure Container Apps

# Push to main → build images in ACR → roll out new Container Apps revisions.
# Authentication uses GitHub OIDC (federated credentials) — no secrets/passwords
# are stored in the repo. Only non-sensitive Azure IDs are kept as GitHub secrets.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write      # required for OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: docuguard
  ACR_NAME: docuguardksacr
  BACKEND_APP: docuguard-api
  FRONTEND_APP: docuguard
  BACKEND_IMAGE: docuguard-backend
  FRONTEND_IMAGE: docuguard-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gated by the "production" environment: the run pauses here until a
    # required reviewer (you) approves, then it deploys.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build backend image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$BACKEND_IMAGE:${{ steps.vars.outputs.tag }}" \
            ./backend

      - name: Build frontend image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$FRONTEND_IMAGE:${{ steps.vars.outputs.tag }}" \
            ./frontend

      - name: Deploy backend revision
        run: |
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$BACKEND_IMAGE:${{ steps.vars.outputs.tag }}"

      - name: Deploy frontend revision
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$FRONTEND_IMAGE:${{ steps.vars.outputs.tag }}"
