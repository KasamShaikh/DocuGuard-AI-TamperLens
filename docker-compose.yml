services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite+pysqlite:///./docuguard.db
      - CORS_ORIGINS=http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - BACKEND_UPSTREAM=http://backend:8000
    ports:
      - "8080:80"
